name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.grype.yaml'
      - '.dockerignore'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dind: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same runner version and tag scheme as the default image, with a
      # `-dind` suffix for the docker-in-docker variant (INSTALL_DOCKER_DAEMON
      # =true — see README "Docker-in-Docker"). Kept in the same job as a
      # matrix, not a separate workflow, so both variants share one
      # version/tag source of truth and can never drift out of sync.
      - name: Compute version and tags
        id: meta
        run: |
          ver="$(grep -oP 'ARG GH_RUNNER_VERSION="\K[^"]+' Dockerfile)"
          [[ -n "$ver" ]] || { echo "::error::could not read GH_RUNNER_VERSION from Dockerfile"; exit 1; }
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"
          short_sha="${GITHUB_SHA:0:7}"
          suffix=""
          [[ "${{ matrix.dind }}" == "true" ]] && suffix="-dind"
          echo "tags=${image}:${ver}-ubuntu-noble${suffix},${image}:ubuntu-noble${suffix},${image}:${ver}-ubuntu-noble${suffix}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "scan_tag=${image}:scan${suffix}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Build amd64 locally first so we can scan it before publishing.
      - name: Build (amd64, load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            INSTALL_CONTAINER_TOOLS=false
            INSTALL_DOCKER_DAEMON=${{ matrix.dind }}
          tags: ${{ steps.meta.outputs.scan_tag }}

      - name: Scan with grype (distinct CVEs)
        uses: anchore/scan-action@v7
        id: grype
        continue-on-error: true
        with:
          image: ${{ steps.meta.outputs.scan_tag }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: Inspect action SARIF report
        if: always()
        run: cat ${{ steps.grype.outputs.sarif }}

      # category disambiguates the two matrix legs' SARIF uploads — without
      # it the dind leg's upload would overwrite the default leg's in the
      # Security tab (both run for the same commit).
      - name: upload Anchore scan SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: dind-${{ matrix.dind }}

      - name: Fail if grype found fixable critical CVEs
        if: steps.grype.outcome == 'failure'
        run: |
          echo "::error::grype scan found fixable critical CVEs — see the Security tab for details"
          exit 1

      - name: Push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            INSTALL_CONTAINER_TOOLS=false
            INSTALL_DOCKER_DAEMON=${{ matrix.dind }}
          tags: ${{ steps.meta.outputs.tags }}
