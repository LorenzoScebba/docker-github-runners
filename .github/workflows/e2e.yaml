name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.grype.yaml'
      - '.dockerignore'
      - '.github/workflows/e2e.yaml'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build (amd64, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            INSTALL_CONTAINER_TOOLS=false
          tags: hardened-runner:e2e

      - name: Scan with grype
        uses: anchore/scan-action@v7
        id: grype
        continue-on-error: true
        with:
          image: hardened-runner:e2e
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: Scan with grype (json, for PR comment)
        uses: anchore/scan-action@v7
        id: grype-json
        continue-on-error: true
        with:
          image: hardened-runner:e2e
          fail-build: false
          severity-cutoff: critical
          only-fixed: true
          output-format: json

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          ref: refs/heads/${{ github.head_ref }}
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Post scan result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.grype.outcome }}';
            const icon = outcome === 'failure' ? '❌' : '✅';

            let criticals = [];
            try {
              const report = JSON.parse(fs.readFileSync('${{ steps.grype-json.outputs.json }}', 'utf8'));
              const seen = new Set();
              for (const match of report.matches ?? []) {
                if (match.vulnerability?.severity !== 'Critical') continue;
                const key = `${match.vulnerability.id}:${match.artifact.name}@${match.artifact.version}`;
                if (seen.has(key)) continue;
                seen.add(key);
                criticals.push({
                  id: match.vulnerability.id,
                  pkg: match.artifact.name,
                  installed: match.artifact.version,
                  fixed: (match.vulnerability.fix?.versions ?? []).join(', ') || 'unknown',
                });
              }
            } catch (err) {
              core.warning(`Could not parse grype JSON report: ${err}`);
            }

            const status = criticals.length
              ? `Fixable **critical** CVEs found:\n\n` +
                `| CVE/GHSA | Package | Installed | Fixed in |\n` +
                `|---|---|---|---|\n` +
                criticals.map(c => `| ${c.id} | ${c.pkg} | ${c.installed} | ${c.fixed} |`).join('\n')
              : 'No fixable critical CVEs found.';

            const body = `## ${icon} grype scan\n\n${status}\n\n` +
              `_Scan ran on \`linux/amd64\` with \`severity-cutoff: critical\` and \`only-fixed: true\`. ` +
              `Ignored rules from \`.grype.yaml\` apply. Full results in the Security tab._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Start container (override entrypoint, skip registration)
        run: |
          docker run -d --name runner-e2e \
            --entrypoint sleep \
            -v /var/run/docker.sock:/var/run/docker.sock \
            hardened-runner:e2e infinity

      - name: Check tool availability
        run: |
          set -e
          for check in \
            "aws --version" \
            "helm version" \
            "gh --version" \
            "docker --version" \
            "yq --version" \
            "make --version" \
            "yarn --version" \
            "chrome --version" \
            "ffmpeg -version" \
            "crane version" \
            "psql --version"; do
            echo "::group::${check}"
            docker exec runner-e2e sh -c "${check}"
            echo "::endgroup::"
          done

      - name: Check container execution (container.image equivalent)
        run: docker exec runner-e2e docker run --rm alpine:3.20 echo "container execution ok"

      - name: Clean up
        if: always()
        run: docker rm -f runner-e2e || true

      - name: Fail if grype found fixable critical CVEs
        if: steps.grype.outcome == 'failure'
        run: |
          echo "::error::grype scan found fixable critical CVEs — see the Security tab for details"
          exit 1