name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.grype.yaml'
      - '.dockerignore'
      - '.github/workflows/e2e.yaml'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  e2e:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # Crossed with `include` below: 2 arches x 2 dind states = 4 legs.
        # The dind leg builds with INSTALL_DOCKER_DAEMON=true and exercises
        # container execution via its own `dockerd` instead of the host
        # socket mount — see README "Docker-in-Docker".
        dind: [false, true]
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Single source of truth for the tag/container name/PR-comment marker
      # suffix used throughout this job, so the two dind legs never collide
      # with each other's images, containers, or sticky comments.
      - name: Compute names
        id: vars
        run: |
          suffix=""
          [[ "${{ matrix.dind }}" == "true" ]] && suffix="-dind"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
          echo "tag=hardened-runner:e2e-${{ matrix.arch }}${suffix}" >> "$GITHUB_OUTPUT"
          echo "container=runner-e2e-${{ matrix.arch }}${suffix}" >> "$GITHUB_OUTPUT"

      - name: Build (${{ matrix.arch }}${{ matrix.dind && '-dind' || '' }}, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            INSTALL_CONTAINER_TOOLS=false
            INSTALL_DOCKER_DAEMON=${{ matrix.dind }}
          tags: ${{ steps.vars.outputs.tag }}

      - name: Scan with grype
        uses: anchore/scan-action@v7
        id: grype
        continue-on-error: true
        with:
          image: ${{ steps.vars.outputs.tag }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: Scan with grype (json, for PR comment)
        uses: anchore/scan-action@v7
        id: grype-json
        continue-on-error: true
        with:
          image: ${{ steps.vars.outputs.tag }}
          fail-build: false
          severity-cutoff: critical
          only-fixed: true
          output-format: json

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          ref: refs/heads/${{ github.head_ref }}
          sha: ${{ github.event.pull_request.head.sha }}
          category: grype-${{ matrix.arch }}${{ steps.vars.outputs.suffix }}

      - name: Post scan result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.grype.outcome }}';
            const icon = outcome === 'failure' ? '❌' : '✅';

            let criticals = [];
            try {
              const report = JSON.parse(fs.readFileSync('${{ steps.grype-json.outputs.json }}', 'utf8'));
              const seen = new Set();
              for (const match of report.matches ?? []) {
                if (match.vulnerability?.severity !== 'Critical') continue;
                const key = `${match.vulnerability.id}:${match.artifact.name}@${match.artifact.version}`;
                if (seen.has(key)) continue;
                seen.add(key);
                criticals.push({
                  id: match.vulnerability.id,
                  pkg: match.artifact.name,
                  installed: match.artifact.version,
                  fixed: (match.vulnerability.fix?.versions ?? []).join(', ') || 'unknown',
                });
              }
            } catch (err) {
              core.warning(`Could not parse grype JSON report: ${err}`);
            }

            const status = criticals.length
              ? `Fixable **critical** CVEs found:\n\n` +
                `| CVE/GHSA | Package | Installed | Fixed in |\n` +
                `|---|---|---|---|\n` +
                criticals.map(c => `| ${c.id} | ${c.pkg} | ${c.installed} | ${c.fixed} |`).join('\n')
              : 'No fixable critical CVEs found.';

            const label = '${{ matrix.arch }}${{ steps.vars.outputs.suffix }}';
            const marker = `<!-- e2e-grype-scan:${label} -->`;
            const body = `${marker}\n## ${icon} grype scan (${label})\n\n${status}\n\n` +
              `_Scan ran on \`${{ matrix.platform }}\` with \`severity-cutoff: critical\` and \`only-fixed: true\`. ` +
              `Ignored rules from \`.grype.yaml\` apply. Full results in the Security tab._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # The dind leg has no host socket to mount — it needs --privileged and
      # a non-overlay backing store for /var/lib/docker (this image's own
      # rootfs is itself overlayfs, and overlay2 can't layer on overlayfs;
      # see README "Docker-in-Docker"). Both legs override the entrypoint to
      # skip runner registration (no credentials in this job).
      - name: Start container (override entrypoint, skip registration)
        run: |
          if [[ "${{ matrix.dind }}" == "true" ]]; then
            docker run -d --name ${{ steps.vars.outputs.container }} \
              --privileged \
              --tmpfs /var/lib/docker \
              --entrypoint sleep \
              ${{ steps.vars.outputs.tag }} infinity
          else
            docker run -d --name ${{ steps.vars.outputs.container }} \
              --entrypoint sleep \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ${{ steps.vars.outputs.tag }} infinity
          fi

      # entrypoint.sh normally starts dockerd itself (START_DOCKER_SERVICE=
      # true) but that path is skipped here since we override the entrypoint
      # to `sleep` above — so start it by hand and wait for readiness,
      # exactly what scripts/hooks/docker-ready.sh does on a real deployment.
      - name: Start dockerd inside the container (dind only)
        if: matrix.dind == true
        run: |
          docker exec ${{ steps.vars.outputs.container }} service docker start
          for i in $(seq 1 30); do
            docker exec ${{ steps.vars.outputs.container }} docker info >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::dockerd never became ready"
          exit 1

      - name: Check tool availability
        run: |
          set -e
          checks=(
            "aws --version"
            "helm version"
            "gh --version"
            "docker --version"
            "yq --version"
            "make --version"
            "yarn --version"
            "chrome --version"
            "ffmpeg -version"
            "crane version"
            "psql --version"
          )
          if [[ "${{ matrix.dind }}" == "true" ]]; then
            checks+=("dockerd --version" "containerd --version" "runc --version")
          fi
          for check in "${checks[@]}"; do
            echo "::group::${check}"
            docker exec ${{ steps.vars.outputs.container }} sh -c "${check}"
            echo "::endgroup::"
          done

      # Same check either way: it just proves `docker run` works inside the
      # runner container — via the mounted host socket on the default leg,
      # via the container's own dockerd (started above) on the dind leg.
      - name: Check container execution (container.image equivalent)
        run: docker exec ${{ steps.vars.outputs.container }} docker run --rm alpine:3.20 echo "container execution ok"

      # docker-ready.sh's own logic (readiness wait, fail-open timeout,
      # shutdown watcher) is never exercised by the steps above — they
      # bypass the entrypoint/CMD chain entirely via `--entrypoint sleep`.
      # This spins up its own throwaway containers from the same image to
      # test that wrapper directly.
      - name: Test docker-ready.sh wrapper behavior (dind only)
        if: matrix.dind == true
        run: bash scripts/test/dind-smoke.sh ${{ steps.vars.outputs.tag }}

      - name: Clean up
        if: always()
        run: docker rm -f ${{ steps.vars.outputs.container }} || true

      - name: Fail if grype found fixable critical CVEs
        if: steps.grype.outcome == 'failure'
        run: |
          echo "::error::grype scan found fixable critical CVEs — see the Security tab for details"
          exit 1
