# Grype configuration, consumed by the CI scan (anchore/scan-action, which
# auto-detects this file at the repo root).
#
# Ignore rules here are NOT blanket suppressions — each one is a critical/fixable
# finding that cannot be remediated yet and is tracked in the README
# "CVEs left unfixed" table. Re-audit on every version bump (see UPDATING.md).
ignore:
  # node-tar Gzip Bomb decompression DoS (GHSA-23hp-3jrh-7fpw / CVE-2026-59873, Critical,
  # fixed in tar@7.5.19). Bundled 3x: NodeSource's system npm and the actions/runner
  # tarball's node20/node24 externals. Accepted risk, not a remediation-path gap: this is a
  # DoS-only finding (disk exhaustion via a crafted archive) that only triggers by extracting
  # an already-malicious/compromised npm package during `npm install` — a scenario that
  # already implies arbitrary code execution far worse than a full disk. This fleet's
  # runners are used by trusted users only. Re-audit if that trust model ever changes (e.g.
  # untrusted-contributor / fork workflows), or drop this once actions/runner's node20
  # externals move past npm 10.8.2 (pinned to tar ^6.2.1, no patched 6.x release exists).
  - vulnerability: GHSA-23hp-3jrh-7fpw
    package:
      name: tar

  # node 20.20.2 (CVE-2026-111497, Critical) bundled in the actions/runner tarball's
  # node20 externals. Not ours to patch — the externals ship pinned inside the runner
  # release, and 2.338.2 (latest as of 2026-11-03) still ships node 20.20.2. Our own
  # system node (NodeSource, NODE_MAJOR=24) is already on a fixed 24.22.x. Drop once an
  # actions/runner release bundles node20 >= a fixed version (or drops node20 entirely).
  - vulnerability: CVE-2026-111497
    package:
      name: node
      location: "/actions-runner/externals/node20/bin/node"

  # python 3.14.8 (CVE-2026-115557, Critical, fixed in 3.14.10) embedded in aws-cli v2's
  # frozen bundle. install_aws_cli() always fetches the latest installer; as of 2.39.3
  # (latest on 2026-11-03) AWS still bundles 3.14.8. Location glob covers the versioned
  # dist dir so the rule survives aws-cli patch bumps. Drop once aws-cli bundles >= 3.14.10.
  - vulnerability: CVE-2026-115557
    package:
      name: python
      location: "/usr/local/aws-cli/v2/*/dist/libpython3.14.so.1.0"

  # Go stdlib CVE-2026-78663 / GO-2026-6604 / GO-2026-6612 (Critical, fixed in go1.26.9 /
  # go1.27.2) embedded in prebuilt release binaries fetched from `releases/latest`:
  # crane v0.22.1 (go1.26.6) and yq v4.54.1 (go1.27.1) — both the newest tags as of
  # 2026-11-03. Location-scoped so a stdlib regression in something we build ourselves
  # (git-lfs) is never masked. Drop per-binary once upstream cuts a release with a fixed Go.
  - vulnerability: CVE-2026-78663
    package:
      name: stdlib
      location: "/usr/local/bin/crane"
  - vulnerability: GO-2026-6604
    package:
      name: stdlib
      location: "/usr/local/bin/crane"
  - vulnerability: GO-2026-6612
    package:
      name: stdlib
      location: "/usr/local/bin/crane"
  - vulnerability: CVE-2026-78663
    package:
      name: stdlib
      location: "/usr/local/bin/yq"
  - vulnerability: GO-2026-6604
    package:
      name: stdlib
      location: "/usr/local/bin/yq"
  - vulnerability: GO-2026-6612
    package:
      name: stdlib
      location: "/usr/local/bin/yq"

  # golang.org/x/net GO-2026-6612 (Critical, fixed in v0.60.0) vendored into binaries we
  # don't build, all already on their latest release as of 2026-11-03:
  #   kubectl 1.35.10 (x/net v0.56.0; no k8s release incl. v1.37.2 pins >= v0.60.0),
  #   docker-buildx 0.38.1 / yq v4.54.1 (v0.59.0),
  #   containerd.io 2.4.2 — containerd/ctr/shim (v0.58.0) and runc 1.5.2 (v0.55.0) —
  #   these four only exist in the -dind (INSTALL_DOCKER_DAEMON=true) image.
  # Location-scoped per binary. Drop each once its upstream release pins x/net >= v0.60.0.
  - vulnerability: GO-2026-6612
    package:
      name: golang.org/x/net
      location: "/usr/bin/kubectl"
  - vulnerability: GO-2026-6612
    package:
      name: golang.org/x/net
      location: "/usr/libexec/docker/cli-plugins/docker-buildx"
  - vulnerability: GO-2026-6612
    package:
      name: golang.org/x/net
      location: "/usr/local/bin/yq"
  - vulnerability: GO-2026-6612
    package:
      name: golang.org/x/net
      location: "/usr/bin/containerd"
  - vulnerability: GO-2026-6612
    package:
      name: golang.org/x/net
      location: "/usr/bin/containerd-shim-runc-v2"
  - vulnerability: GO-2026-6612
    package:
      name: golang.org/x/net
      location: "/usr/bin/ctr"
  - vulnerability: GO-2026-6612
    package:
      name: golang.org/x/net
      location: "/usr/bin/runc"
